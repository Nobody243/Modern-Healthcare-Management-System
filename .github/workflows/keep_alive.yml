name: Oracle Autonomous DB Keep-Alive

on:
  schedule:
    # Runs at 00:00 UTC every 3 days (well below Oracle's 7-day inactivity threshold)
    - cron: '0 0 */3 * *'
  workflow_dispatch:
    # Allows manual trigger from GitHub Actions UI for testing and validation

jobs:
  keep-alive:
    name: Execute Keep-Alive Query
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check required Oracle secrets
        id: oracle-secrets
        env:
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_PASSWORD: ${{ secrets.ORACLE_PASSWORD }}
          ORACLE_WALLET_BASE64: ${{ secrets.ORACLE_WALLET_BASE64 }}
          ORACLE_TNS_NAME: ${{ secrets.ORACLE_TNS_NAME }}
        run: |
          missing=()
          for var in ORACLE_USER ORACLE_PASSWORD ORACLE_WALLET_BASE64 ORACLE_TNS_NAME; do
            if [ -z "${!var}" ]; then
              missing+=("$var")
            fi
          done

          if [ ${#missing[@]} -gt 0 ]; then
            echo "has_required_secrets=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping keep-alive ping due to missing secrets: ${missing[*]}"
          else
            echo "has_required_secrets=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install python-oracledb
        if: steps.oracle-secrets.outputs.has_required_secrets == 'true'
        run: pip install oracledb

      - name: Run keep-alive ping
        if: steps.oracle-secrets.outputs.has_required_secrets == 'true'
        env:
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_PASSWORD: ${{ secrets.ORACLE_PASSWORD }}
          ORACLE_WALLET_BASE64: ${{ secrets.ORACLE_WALLET_BASE64 }}
          ORACLE_WALLET_PASSWORD: ${{ secrets.ORACLE_WALLET_PASSWORD }}
          ORACLE_TNS_NAME: ${{ secrets.ORACLE_TNS_NAME }}
        run: python keep_alive.py

      - name: Keep-alive skipped
        if: steps.oracle-secrets.outputs.has_required_secrets != 'true'
        run: echo "Keep-alive query skipped because required Oracle secrets are not configured."
